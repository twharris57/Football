# Local development: builds the image from source. For NAS deployment
# (pulls the prebuilt GHCR image instead), see docker-compose.deploy.yml.
services:
  dynasty-draft:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - nfl_data_cache:/app/.cache
    restart: unless-stopped

  confidence-pool:
    build:
      context: .
      dockerfile: confidence_pool/Dockerfile
    ports:
      - "8502:8502"
    volumes:
      - confidence_pool_data:/app/confidence_pool_data
    restart: unless-stopped

  scout-api:
    build:
      context: .
      dockerfile: dynasty/Dockerfile.scout-api
    ports:
      - "8503:8503"
    environment:
      - SCOUT_API_TOKEN=${SCOUT_API_TOKEN:?SCOUT_API_TOKEN must be set (e.g. in a local .env) - see .env.example}
    restart: unless-stopped

volumes:
  nfl_data_cache:
  confidence_pool_data:
