# Local development: builds the image from source. For NAS deployment
# (pulls the prebuilt GHCR image instead), see docker-compose.deploy.yml.
services:
  dynasty-draft:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - nfl_data_cache:/app/.cache
    restart: unless-stopped

  confidence-pool:
    build:
      context: .
      dockerfile: confidence_pool/Dockerfile
    ports:
      - "8502:8502"
    volumes:
      - confidence_pool_data:/app/confidence_pool_data
    restart: unless-stopped

  # A batch job, not a long-running service - it syncs the scout-data
  # branch down and exits (see dynasty/scout_api/sync.py). No ports, no
  # restart policy: `restart: unless-stopped` would crash-loop it forever
  # since a clean exit 0 is its normal, expected outcome, not a failure to
  # recover from. `profiles: [cron]` keeps it out of a plain `docker
  # compose up`; run it explicitly with `docker compose run --rm scout-api`.
  scout-api:
    build:
      context: .
      dockerfile: dynasty/Dockerfile.scout-api
    profiles: ["cron"]
    environment:
      - SCOUT_DATA_GITHUB_TOKEN=${SCOUT_DATA_GITHUB_TOKEN:-}
    volumes:
      - scout_data:/app/scout_data

volumes:
  nfl_data_cache:
  confidence_pool_data:
  scout_data:
