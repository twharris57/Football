# Local development: builds the image from source. For NAS deployment
# (pulls the prebuilt GHCR image instead), see docker-compose.deploy.yml.
services:
  dynasty-draft:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - nfl_data_cache:/app/.cache
      - dynasty_data:/app/dynasty_data
    restart: unless-stopped

  confidence-pool:
    build:
      context: .
      dockerfile: confidence_pool/Dockerfile
    ports:
      - "8502:8502"
    volumes:
      - confidence_pool_data:/app/confidence_pool_data
    restart: unless-stopped

  # Batch job that exits when done, so no restart policy (it would loop).
  # Run with: docker compose run --rm scout-api
  scout-api:
    build:
      context: .
      dockerfile: dynasty/Dockerfile.scout-api
    profiles: ["cron"]
    environment:
      - SCOUT_DATA_GITHUB_TOKEN=${SCOUT_DATA_GITHUB_TOKEN:-}
    volumes:
      - scout_data:/app/scout_data

volumes:
  nfl_data_cache:
  dynasty_data:
  confidence_pool_data:
  scout_data:
