# Local development: builds the image from source. For NAS deployment
# (pulls the prebuilt GHCR image instead), see docker-compose.deploy.yml.
services:
  dynasty-draft:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - path: ./football.secrets.env
        required: false  # without the token, the scout API answers 503
    volumes:
      - nfl_data_cache:/app/.cache
      - dynasty_data:/app/dynasty_data
    restart: unless-stopped

  confidence-pool:
    build:
      context: .
      dockerfile: confidence_pool/Dockerfile
    ports:
      - "8502:8502"
    volumes:
      - confidence_pool_data:/app/confidence_pool_data
    restart: unless-stopped

volumes:
  nfl_data_cache:
  dynasty_data:
  confidence_pool_data:
