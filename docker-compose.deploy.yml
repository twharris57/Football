# Deployment reference for this app's image, published by
# .github/workflows/docker-publish.yml on every push to main. This is the canonical,
# runnable description of what the image needs to run (image, ports, volumes) --
# nas-configs (this repo's NAS deployment owner) reads it and adapts it into its own
# conventions (container naming, secrets handling, etc.) rather than building/deploying
# from source itself. Keep this file and .env.example accurate as deployment needs
# change -- that's the signal the deployed copy elsewhere may need re-syncing.
#
# Still valid to run directly for local testing: copy .env.example to .env, then
#   docker compose -f docker-compose.deploy.yml up -d
services:
  dynasty-draft:
    image: ghcr.io/twharris57/football-dynasty-draft:latest
    pull_policy: always
    ports:
      - "${HOST_PORT:-8501}:8501"
    volumes:
      - nfl_data_cache:/app/.cache
    restart: unless-stopped

volumes:
  nfl_data_cache:
