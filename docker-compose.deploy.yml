# Deployment reference: ../nas-configs adapts this file. Images are built by CI.
# Local test: copy .env.example to .env, then
#   docker compose -f docker-compose.deploy.yml up -d
services:
  dynasty-draft:
    image: ghcr.io/twharris57/football-dynasty-draft:latest
    pull_policy: always
    ports:
      - "${DYNASTY_HOST_PORT:-8501}:8501"
    volumes:
      - nfl_data_cache:/app/.cache
      - dynasty_data:/app/dynasty_data
    restart: unless-stopped

  confidence-pool:
    image: ghcr.io/twharris57/football-confidence-pool:latest
    pull_policy: always
    ports:
      - "${CONFIDENCE_POOL_HOST_PORT:-8502}:8502"
    volumes:
      - confidence_pool_data:/app/confidence_pool_data
    restart: unless-stopped

  # Scheduled batch job (Synology Task Scheduler), not a service:
  #   docker compose -f docker-compose.deploy.yml run --rm scout-api
  scout-api:
    image: ghcr.io/twharris57/football-scout-api:latest
    pull_policy: always
    profiles: ["cron"]
    env_file:
      - path: ./football.secrets.env
        required: false  # the token is optional
    volumes:
      - scout_data:/app/scout_data

volumes:
  nfl_data_cache:
  # The next three hold user data; include them in NAS backups.
  dynasty_data:
  confidence_pool_data:
  scout_data:
