# Deployment reference: ../nas-configs adapts this file. Images are built by CI.
# Local test: copy .env.example to .env, then
#   docker compose -f docker-compose.deploy.yml up -d
services:
  dynasty-draft:
    image: ghcr.io/twharris57/football-dynasty-draft:latest
    pull_policy: always
    ports:
      - "${DYNASTY_HOST_PORT:-8501}:8501"
    env_file:
      - path: ./football.secrets.env
        required: false  # without the token, the scout API answers 503
    volumes:
      - nfl_data_cache:/app/.cache
      - dynasty_data:/app/dynasty_data
    restart: unless-stopped

  confidence-pool:
    image: ghcr.io/twharris57/football-confidence-pool:latest
    pull_policy: always
    ports:
      - "${CONFIDENCE_POOL_HOST_PORT:-8502}:8502"
    volumes:
      - confidence_pool_data:/app/confidence_pool_data
    restart: unless-stopped

volumes:
  nfl_data_cache:
  # The next two hold user data; include them in NAS backups.
  dynasty_data:
  confidence_pool_data:
