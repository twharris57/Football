# Deployment reference for this app's image, published by
# .github/workflows/docker-publish.yml on every push to main. This is the canonical,
# runnable description of what the image needs to run (image, ports, volumes) --
# nas-configs (this repo's NAS deployment owner) reads it and adapts it into its own
# conventions (container naming, secrets handling, etc.) rather than building/deploying
# from source itself. Keep this file and .env.example accurate as deployment needs
# change -- that's the signal the deployed copy elsewhere may need re-syncing.
#
# Still valid to run directly for local testing: copy .env.example to .env, then
#   docker compose -f docker-compose.deploy.yml up -d
services:
  dynasty-draft:
    image: ghcr.io/twharris57/football-dynasty-draft:latest
    pull_policy: always
    ports:
      - "${DYNASTY_HOST_PORT:-8501}:8501"
    volumes:
      - nfl_data_cache:/app/.cache
      - dynasty_data:/app/dynasty_data
    restart: unless-stopped

  confidence-pool:
    image: ghcr.io/twharris57/football-confidence-pool:latest
    pull_policy: always
    ports:
      - "${CONFIDENCE_POOL_HOST_PORT:-8502}:8502"
    volumes:
      - confidence_pool_data:/app/confidence_pool_data
    restart: unless-stopped

  # SC-15's NAS-side sync (.claude/PROJECT_PLAN_DYNASTY.md) - pulls the
  # scout-data branch's JSON state down and mirrors it into
  # scout_data/scout_data.db. A batch job, not a long-running service: no
  # ports, no restart policy (a clean exit is its normal outcome, not a
  # crash to recover from). Not started by `docker compose up`
  # (`profiles: [cron]`) - the NAS's Synology Task Scheduler invokes it
  # directly on a schedule instead, e.g.
  # `docker compose -f docker-compose.deploy.yml run --rm scout-api`.
  scout-api:
    image: ghcr.io/twharris57/football-scout-api:latest
    pull_policy: always
    profiles: ["cron"]
    environment:
      - SCOUT_DATA_GITHUB_TOKEN=${SCOUT_DATA_GITHUB_TOKEN:-}
    volumes:
      - scout_data:/app/scout_data

volumes:
  nfl_data_cache:
  # The trade-block store (SC-18) -- survives container restarts/redeploys,
  # unlike the rest of the dynasty image which is baked in at build time.
  dynasty_data:
  # Weekly picks/games history -- see docs/confidence-pool-web-app.md and
  # .claude/PROJECT_PLAN_CONFIDENCE_POOL.md's CP-2: confirm this volume is
  # actually covered by the NAS's offsite backup (it's durable across
  # container restarts either way, but backup coverage is a separate,
  # NAS-side question).
  confidence_pool_data:
  # The scout-data mirror (SC-15) - needs the same NAS backup-coverage
  # check as confidence_pool_data above once this is actually deployed.
  scout_data:
