# Deployment reference for this app's image, published by
# .github/workflows/docker-publish.yml on every push to main. This is the canonical,
# runnable description of what the image needs to run (image, ports, volumes) --
# `../nas-configs` is what actually deploys it on the NAS, adapting this into its own
# conventions (container naming, secrets handling, etc.). See
# `../nas-configs/.claude/conventions/app_deployment_reference.md` for what this file
# and .env.example are expected to document, and keep them accurate as deployment needs
# change -- that's the signal nas-configs' copy may need re-syncing.
#
# Still valid to run directly for local testing: copy .env.example to .env, then
#   docker compose -f docker-compose.deploy.yml up -d
services:
  dynasty-draft:
    image: ghcr.io/twharris57/football-dynasty-draft:latest
    pull_policy: always
    ports:
      - "${HOST_PORT:-8501}:8501"
    volumes:
      - nfl_data_cache:/app/.cache
    restart: unless-stopped

volumes:
  nfl_data_cache:
